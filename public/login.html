<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Painel</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login">
  <form class="box" id="f">
    <div class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 4 21 19H3Z"/></svg></div>painel</div>
    <p>Digite a senha de acesso</p>
    <input class="input" type="password" id="pw" placeholder="Senha" autofocus autocomplete="current-password">
    <button class="btn primary" type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) location.href = '/'; else err.textContent = (await r.json().catch(() => ({}))).error || 'Erro ao entrar';
});
</script>
</body>
</html>
