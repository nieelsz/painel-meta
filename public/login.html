<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a17">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Track+"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Entrar — Track+</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login">
  <form class="box" id="f">
    <div class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 18 8.5 12.5 12.5 15.5 17.1 9.5"/><circle cx="19" cy="7" r="3.2"/><circle cx="19" cy="7" r="1.3" fill="#fff" stroke="none"/></svg></div><span>Track<span class="plus">+</span></span></div>
    <p>Digite a senha de acesso</p>
    <input class="input" type="password" id="pw" placeholder="Senha" autofocus autocomplete="current-password">
    <button class="btn primary" type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) location.href = '/'; else err.textContent = (await r.json().catch(() => ({}))).error || 'Erro ao entrar';
});
</script>
</body>
</html>
